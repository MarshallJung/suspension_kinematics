<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 390" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0F17" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <marker id="arrowUpGreen" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10B981" />
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="390" rx="16" fill="url(#bg3)" stroke="#334155" stroke-width="2" />

  <text x="440" y="34" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="900" text-anchor="middle">
    TIRE LOAD SENSITIVITY &amp; SQUARE VS. STAGGERED SETUP (PORSCHE 944 EXAMPLE)
  </text>
  <text x="440" y="54" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle">
    Widening Front Tire Section Width (225mm → 255mm Square, Same Compound) Expands F_z,nom,eff &amp; Reduces Contact Stress Saturation
  </text>

  <!-- Left Plot: Peak Lateral Force F_y vs Vertical Load F_z -->
  <rect x="26" y="72" width="470" height="295" rx="12" fill="#161F30" stroke="#334155" stroke-width="1.5" />
  <text x="261" y="96" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="800" text-anchor="middle">
    PEAK LATERAL GRIP F_y,max vs. VERTICAL WHEEL LOAD F_z
  </text>

  <!-- Axes -->
  <line x1="80" y1="320" x2="465" y2="320" stroke="#94A3B8" stroke-width="2" />
  <line x1="80" y1="320" x2="80" y2="115" stroke="#94A3B8" stroke-width="2" />

  <text x="272" y="352" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">
    Vertical Tire Load F_z (lbs) → [Static ~780 lbs  |  Loaded Outside Front ~1,240 lbs]
  </text>
  <text x="42" y="218" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle" transform="rotate(-90, 42, 218)">
    Peak Lateral Force F_y,max (lbs)
  </text>

  <!-- Ideal Linear Coulomb Friction Reference Line (Dashed Grey) -->
  <line x1="80" y1="320" x2="440" y2="118" stroke="#64748B" stroke-width="1.5" stroke-dasharray="5,5" />
  <text x="360" y="132" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700">
    Ideal Linear μ_0 · F_z (No Load Sensitivity)
  </text>

  <!-- 255mm Wide Tire Curve (Green - Higher Nominal Capacity F_z,nom,eff) -->
  <path d="M 80 320 Q 250 218 450 156" fill="none" stroke="#10B981" stroke-width="3.5" />
  <text x="385" y="150" fill="#10B981" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" text-anchor="end">
    255mm Square Front Tire
  </text>

  <!-- 225mm Narrower OEM Tire Curve (Cyan/Orange - Saturates Earlier at High F_z) -->
  <path d="M 80 320 Q 235 232 450 194" fill="none" stroke="#38BDF8" stroke-width="3.2" />
  <text x="445" y="212" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" text-anchor="end">
    225mm OEM Front Tire
  </text>

  <!-- Operating Point at Loaded Outside Front Wheel (F_z = 1,240 lbs -> x = 355) -->
  <line x1="355" y1="320" x2="355" y2="165" stroke="#F59E0B" stroke-width="1.4" stroke-dasharray="3,3" />
  <circle cx="355" cy="212" r="5.5" fill="#38BDF8" stroke="#0B0F17" stroke-width="1.5" />
  <circle cx="355" cy="182" r="5.5" fill="#10B981" stroke="#0B0F17" stroke-width="1.5" />

  <!-- Gain Arrow -->
  <line x1="370" y1="210" x2="370" y2="185" stroke="#10B981" stroke-width="2.5" marker-end="url(#arrowUpGreen)" />
  <text x="378" y="201" fill="#10B981" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="800">
    +ΔF_y,f Gain
  </text>

  <!-- Right Panel: Physical Summary Box -->
  <rect x="514" y="72" width="342" height="295" rx="12" fill="#161F30" stroke="#10B981" stroke-width="1.5" />
  <text x="685" y="98" fill="#10B981" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="900" text-anchor="middle">
    WHY SQUARE 255/255 WORKS ON A 944
  </text>

  <rect x="532" y="114" width="306" height="68" rx="8" fill="#0F172A" stroke="#334155" />
  <text x="544" y="134" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="800">
    1. Contact Patch Capacity Scaling
  </text>
  <text x="544" y="153" fill="#E2E8F0" font-family="monospace" font-size="11" font-weight="700">
    F_z,nom,eff = F_z,nom · (255 / 225)^1.35 = 1.18×
  </text>
  <text x="544" y="171" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">
    +13% wider tread expands nominal load capacity by ~18%.
  </text>

  <rect x="532" y="192" width="306" height="76" rx="8" fill="#0F172A" stroke="#334155" />
  <text x="544" y="212" fill="#F59E0B" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="800">
    2. Lower Contact Stress Under Trail-Braking
  </text>
  <text x="544" y="231" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">
    When outside front load spikes to 1,240 lbs on entry,
  </text>
  <text x="544" y="247" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="10.5">
    the 255mm tire operates at lower normalized stress
  </text>
  <text x="544" y="262" fill="#10B981" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700">
    → Higher effective μ(F_z) &amp; smaller front slip angle α_F!
  </text>

  <rect x="532" y="278" width="306" height="72" rx="8" fill="#0F172A" stroke="#334155" />
  <text x="544" y="298" fill="#10B981" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="800">
    3. Resulting Balance Shift (FR Archetype)
  </text>
  <text x="544" y="317" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="11">
    • OEM Stagger (225F / 255R): <tspan fill="#38BDF8" font-weight="800">Entry/Mid Push (US)</tspan>
  </text>
  <text x="544" y="336" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="11">
    • Square Track (255F / 255R): <tspan fill="#10B981" font-weight="800">Crisp, Neutral Rotation</tspan>
  </text>
</svg>
