<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0F17" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="carBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#F59E0B" />
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38BDF8" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10B981" />
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#F97316" />
    </marker>
  </defs>

  <!-- Outer Card Background -->
  <rect x="0" y="0" width="880" height="540" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="2" />

  <!-- Top Header & 3-Phase Timeline Bar -->
  <rect x="20" y="18" width="840" height="56" rx="10" fill="#161F30" stroke="#334155" stroke-width="1.2" />
  <text x="38" y="42" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800">
    2D TOP-DOWN CHASSIS &amp; 4-CORNER FRICTION CIRCLE TELEMETRY
  </text>
  <text x="38" y="61" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">
    Left Turn • 78 mph • 1.05G Lateral • Trail-Braking Entry (0.45G Decel) • Pinned Baseline Ghost Rings Shown
  </text>

  <!-- 3-Phase Pills -->
  <rect x="505" y="27" width="108" height="38" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="2" />
  <text x="559" y="43" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" text-anchor="middle">1. ENTRY</text>
  <text x="559" y="58" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle">US +14 (-5)</text>

  <rect x="621" y="27" width="108" height="38" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1.2" />
  <text x="675" y="43" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" text-anchor="middle">2. APEX</text>
  <text x="675" y="58" fill="#10B981" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle">Neutral (+2)</text>

  <rect x="737" y="27" width="108" height="38" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1.2" />
  <text x="791" y="43" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" text-anchor="middle">3. EXIT</text>
  <text x="791" y="58" fill="#F97316" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle">OS -9</text>

  <!-- Engineering Grid Area -->
  <g opacity="0.35">
    <line x1="260" y1="90" x2="260" y2="510" stroke="#1E293B" stroke-width="1" />
    <line x1="350" y1="90" x2="350" y2="510" stroke="#1E293B" stroke-width="1" />
    <line x1="440" y1="90" x2="440" y2="510" stroke="#475569" stroke-width="1.2" stroke-dasharray="5,5" />
    <line x1="530" y1="90" x2="530" y2="510" stroke="#1E293B" stroke-width="1" />
    <line x1="620" y1="90" x2="620" y2="510" stroke="#1E293B" stroke-width="1" />
    <line x1="220" y1="185" x2="660" y2="185" stroke="#1E293B" stroke-width="1" />
    <line x1="220" y1="300" x2="660" y2="300" stroke="#1E293B" stroke-width="1" />
    <line x1="220" y1="415" x2="660" y2="415" stroke="#1E293B" stroke-width="1" />
  </g>

  <!-- Turn Path & Yaw Push Indicator -->
  <path d="M 440 120 Q 420 92 365 88" fill="none" stroke="#10B981" stroke-width="2.5" stroke-dasharray="4,4" marker-end="url(#arrowGreen)" />
  <text x="355" y="92" fill="#10B981" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" text-anchor="end">INTENDED TURN PATH</text>

  <path d="M 440 112 Q 485 102 522 112" fill="none" stroke="#38BDF8" stroke-width="3" marker-end="url(#arrowCyan)" />
  <text x="530" y="114" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="800">NOSE PUSH (α_F &gt; α_R)</text>

  <!-- Car Body Silhouette -->
  <path d="M 380 124 C 406 112, 474 112, 500 124 L 516 170 L 512 245 L 518 375 L 512 458 C 484 470, 396 470, 368 458 L 362 375 L 368 245 L 364 170 Z" fill="url(#carBody)" stroke="#64748B" stroke-width="2" />
  <!-- Cabin -->
  <path d="M 384 218 Q 440 200 496 218 L 486 340 Q 440 356 394 340 Z" fill="#0B0F17" fill-opacity="0.65" stroke="#475569" stroke-width="1.5" />
  <!-- Rear Wing -->
  <rect x="364" y="446" width="152" height="11" rx="3" fill="#1E293B" stroke="#94A3B8" stroke-width="1.4" />

  <!-- Suspension Control Arms & Anti-Roll Bars -->
  <line x1="388" y1="185" x2="312" y2="185" stroke="#64748B" stroke-width="3.5" />
  <line x1="492" y1="185" x2="568" y2="185" stroke="#64748B" stroke-width="3.5" />
  <path d="M 330 185 L 378 162 L 502 162 L 550 185" fill="none" stroke="#38BDF8" stroke-width="4" />

  <line x1="388" y1="415" x2="310" y2="415" stroke="#64748B" stroke-width="3.5" />
  <line x1="492" y1="415" x2="570" y2="415" stroke="#64748B" stroke-width="3.5" />
  <path d="M 328 415 L 378 438 L 502 438 L 552 415" fill="none" stroke="#F97316" stroke-width="3.5" />

  <!-- TLLTD Badges -->
  <rect x="352" y="140" width="176" height="18" rx="4" fill="#0B0F17" fill-opacity="0.85" />
  <text x="440" y="153" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" text-anchor="middle">
    TLLTD Front: 51.8% (FRSR 54%)
  </text>
  <rect x="352" y="440" width="176" height="18" rx="4" fill="#0B0F17" fill-opacity="0.85" />
  <text x="440" y="453" fill="#F97316" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" text-anchor="middle">
    TLLTD Rear: 48.2% (Mass 62%)
  </text>

  <!-- Center of Gravity (CG) & Diagonal Weight Transfer Vector -->
  <circle cx="440" cy="322" r="9" fill="#F59E0B" stroke="#0B0F17" stroke-width="2" />
  <line x1="432" y1="322" x2="448" y2="322" stroke="#0B0F17" stroke-width="2" />
  <line x1="440" y1="314" x2="440" y2="330" stroke="#0B0F17" stroke-width="2" />
  <line x1="440" y1="322" x2="504" y2="262" stroke="#F59E0B" stroke-width="4" marker-end="url(#arrowAmber)" />
  <text x="440" y="344" fill="#F59E0B" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">
    CG (38/62 • 3,155 lbs)
  </text>
  <text x="515" y="256" fill="#F59E0B" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800">
    ΔW_diag Vector
  </text>

  <!-- FL Wheel (Inside Front - Unloaded) -->
  <g transform="translate(312, 185)">
    <circle cx="0" cy="0" r="28" fill="none" stroke="#64748B" stroke-width="1.5" stroke-dasharray="4,4" />
    <circle cx="0" cy="0" r="24" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-width="2.2" />
    <circle cx="0" cy="0" r="15" fill="#10B981" fill-opacity="0.3" />
    <g transform="rotate(-11)">
      <rect x="-10" y="-23" width="20" height="46" rx="4" fill="#0B0F17" stroke="#94A3B8" stroke-width="1.8" />
    </g>
    <line x1="0" y1="0" x2="-16" y2="10" stroke="#10B981" stroke-width="3" />
  </g>

  <!-- FR Wheel (Outside Front - Heavily Loaded in Trail-Braking Left Turn) -->
  <g transform="translate(568, 185)">
    <circle cx="0" cy="0" r="52" fill="none" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4,3" />
    <circle cx="0" cy="0" r="46" fill="none" stroke="#64748B" stroke-width="1.6" stroke-dasharray="4,4" />
    <circle cx="0" cy="0" r="43" fill="#F59E0B" fill-opacity="0.16" stroke="#F59E0B" stroke-width="2.5" />
    <circle cx="0" cy="0" r="39" fill="#F59E0B" fill-opacity="0.32" />
    <g transform="rotate(-9.5)">
      <rect x="-11" y="-23" width="22" height="46" rx="4" fill="#0B0F17" stroke="#38BDF8" stroke-width="2.4" />
    </g>
    <!-- Slip Angle Vector -->
    <line x1="0" y1="0" x2="26" y2="-34" stroke="#F59E0B" stroke-width="2" stroke-dasharray="3,3" />
    <!-- Resultant Tire Force Vector -->
    <line x1="0" y1="0" x2="36" y2="18" stroke="#F59E0B" stroke-width="3.5" />
    <circle cx="36" cy="18" r="4" fill="#F59E0B" />
  </g>

  <!-- RL Wheel (Inside Rear) -->
  <g transform="translate(310, 415)">
    <circle cx="0" cy="0" r="29" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-width="2.2" />
    <circle cx="0" cy="0" r="19" fill="#10B981" fill-opacity="0.3" />
    <g transform="rotate(1.4)">
      <rect x="-12" y="-23" width="24" height="46" rx="4" fill="#0B0F17" stroke="#94A3B8" stroke-width="1.8" />
    </g>
    <line x1="0" y1="0" x2="-19" y2="8" stroke="#10B981" stroke-width="3" />
  </g>

  <!-- RR Wheel (Outside Rear) -->
  <g transform="translate(570, 415)">
    <circle cx="0" cy="0" r="45" fill="none" stroke="#64748B" stroke-width="1.5" stroke-dasharray="4,4" />
    <circle cx="0" cy="0" r="47" fill="#38BDF8" fill-opacity="0.15" stroke="#38BDF8" stroke-width="2.4" />
    <circle cx="0" cy="0" r="38" fill="#38BDF8" fill-opacity="0.3" />
    <g transform="rotate(-1.4)">
      <rect x="-12" y="-23" width="24" height="46" rx="4" fill="#0B0F17" stroke="#94A3B8" stroke-width="1.8" />
    </g>
    <line x1="0" y1="0" x2="22" y2="-32" stroke="#F59E0B" stroke-width="2" stroke-dasharray="3,3" />
    <line x1="0" y1="0" x2="35" y2="10" stroke="#38BDF8" stroke-width="3.2" />
    <circle cx="35" cy="10" r="3.8" fill="#38BDF8" />
  </g>

  <!-- Left & Right Corner HUD Callout Cards -->
  <!-- FL Card -->
  <rect x="24" y="130" width="215" height="92" rx="10" fill="#161F30" stroke="#334155" stroke-width="1.5" />
  <text x="38" y="154" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="900">FL • INSIDE (245mm)</text>
  <rect x="172" y="139" width="56" height="20" rx="5" fill="#10B981" fill-opacity="0.2" stroke="#10B981" />
  <text x="200" y="153" fill="#10B981" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">62% Grip</text>
  <text x="38" y="178" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="12">Dynamic Load: <tspan fill="#F8FAFC" font-weight="800">395 lbs</tspan></text>
  <text x="38" y="198" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="12">γ_dyn: <tspan fill="#F8FAFC" font-weight="700">-1.6°</tspan>   •   Slip α: <tspan fill="#F59E0B" font-weight="700">2.9°</tspan></text>

  <!-- FR Card (Selected Outside Loaded Tire) -->
  <rect x="641" y="130" width="215" height="92" rx="10" fill="#1E293B" stroke="#38BDF8" stroke-width="2" />
  <text x="655" y="154" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="900">FR • OUTSIDE (245mm)</text>
  <rect x="789" y="139" width="56" height="20" rx="5" fill="#F59E0B" fill-opacity="0.2" stroke="#F59E0B" />
  <text x="817" y="153" fill="#F59E0B" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">91% Grip</text>
  <text x="655" y="178" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="12">Dynamic Load: <tspan fill="#F8FAFC" font-weight="800">1,015 lbs (-38)</tspan></text>
  <text x="655" y="198" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="12">γ_dyn: <tspan fill="#F8FAFC" font-weight="700">-2.2°</tspan>   •   Slip α: <tspan fill="#F59E0B" font-weight="700">5.6°</tspan></text>

  <!-- RL Card -->
  <rect x="24" y="365" width="215" height="92" rx="10" fill="#161F30" stroke="#334155" stroke-width="1.5" />
  <text x="38" y="389" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="900">RL • INSIDE (305mm)</text>
  <rect x="172" y="374" width="56" height="20" rx="5" fill="#10B981" fill-opacity="0.2" stroke="#10B981" />
  <text x="200" y="388" fill="#10B981" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">65% Grip</text>
  <text x="38" y="413" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="12">Dynamic Load: <tspan fill="#F8FAFC" font-weight="800">580 lbs</tspan></text>
  <text x="38" y="433" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="12">γ_dyn: <tspan fill="#F8FAFC" font-weight="700">-1.3°</tspan>   •   Slip α: <tspan fill="#F59E0B" font-weight="700">3.1°</tspan></text>

  <!-- RR Card -->
  <rect x="641" y="365" width="215" height="92" rx="10" fill="#161F30" stroke="#334155" stroke-width="1.5" />
  <text x="655" y="389" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="900">RR • OUTSIDE (305mm)</text>
  <rect x="789" y="374" width="56" height="20" rx="5" fill="#38BDF8" fill-opacity="0.2" stroke="#38BDF8" />
  <text x="817" y="388" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">81% Grip</text>
  <text x="655" y="413" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="12">Dynamic Load: <tspan fill="#F8FAFC" font-weight="800">1,245 lbs (+38)</tspan></text>
  <text x="655" y="433" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="12">γ_dyn: <tspan fill="#F8FAFC" font-weight="700">-2.1°</tspan>   •   Slip α: <tspan fill="#F59E0B" font-weight="700">4.9°</tspan></text>

  <!-- Bottom Kinematic Bar -->
  <rect x="20" y="482" width="840" height="40" rx="8" fill="#161F30" stroke="#334155" stroke-width="1.2" />
  <text x="440" y="507" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">
    Dynamic Roll Centers: <tspan fill="#38BDF8">31mm F / 70mm R</tspan> (Static: 38 / 72mm)   •   Roll Moment Arm h_roll: <tspan fill="#F59E0B">408 mm</tspan>   •   Ride Freq: <tspan fill="#10B981">2.04Hz F / 2.18Hz R</tspan>
  </text>
</svg>
